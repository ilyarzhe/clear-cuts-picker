<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Spreadsheets</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f8f9fa;
    color: #202124;
}
#content { text-align: center; padding: 40px; max-width: 480px; }
h1 { font-size: 20px; font-weight: 500; margin: 0 0 12px; }
#hint { color: #5f6368; font-size: 13px; margin-bottom: 8px; display: none; }
#hint.visible { display: block; }
#status { color: #5f6368; font-size: 14px; }
#error { color: #d93025; font-size: 14px; line-height: 1.5; display: none; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #e8eaed; border-top-color: #1a73e8; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="content">
    <h1>Select Spreadsheets</h1>
    <div id="hint">Tip: Check multiple files to grant access in one go</div>
    <div id="status"><span class="spinner"></span>Loading Google Picker...</div>
    <div id="error"></div>
</div>
<script>
(function() {
    var params = new URLSearchParams(window.location.search.substring(1));
    var extId = params.get('extId');
    var appId = params.get('appId');
    var apiKey = null;
    var token = null;
    var pickerApiLoaded = false;
    var pickerReady = false;

    function showError(msg) {
        document.getElementById('status').style.display = 'none';
        var errEl = document.getElementById('error');
        errEl.style.display = 'block';
        errEl.textContent = msg || 'An unexpected error occurred.';
        if (extId && typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
            chrome.runtime.sendMessage(extId, { type: 'pickerResult', error: msg || 'Unknown error' });
        }
    }

    function buildPicker() {
        if (pickerReady || !pickerApiLoaded || !token || !apiKey) return;
        pickerReady = true;
        try {
            var view = new google.picker.View(google.picker.ViewId.SPREADSHEETS);
            var picker = new google.picker.PickerBuilder()
                .setOAuthToken(token)
                .setDeveloperKey(apiKey)
                .setAppId(appId)
                .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
                .addView(view)
                .setCallback(function(data) {
                    if (data.action === google.picker.Action.PICKED) {
                        var docs = data.docs;
                        var fileIds = docs.map(function(d) { return d.id; });
                        var fileNames = docs.map(function(d) { return d.name; });
                        var fileUrls = docs.map(function(d) { return d.url; });
                        if (extId && typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
                            chrome.runtime.sendMessage(extId, {
                                type: 'pickerResult',
                                fileIds: fileIds,
                                fileNames: fileNames,
                                fileUrls: fileUrls,
                                fileId: fileIds[0],
                                fileName: fileNames[0],
                                fileUrl: fileUrls[0]
                            }, function() {});
                        }
                    } else if (data.action === google.picker.Action.CANCEL) {
                        if (extId && typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
                            chrome.runtime.sendMessage(extId, {
                                type: 'pickerResult',
                                cancelled: true
                            }, function() {});
                        }
                    }
                })
                .build();
            picker.setVisible(true);
            document.getElementById('hint').className = 'visible';
        } catch (e) {
            showError('Failed to initialize Google Picker. Token may be expired. Close this tab and try reconnecting.');
        }
    }

    function requestPickerAuth() {
    if (!extId || !appId) {
        showError('Missing required parameters. Please close this tab and try again.');
        return;
    }
        if (typeof chrome === 'undefined' || !chrome.runtime || !chrome.runtime.sendMessage) {
            showError('Could not connect to the extension. Close this tab and try again.');
            return;
        }
        chrome.runtime.sendMessage(extId, { type: 'pickerAuthRequest' }, function(response) {
            if (chrome.runtime.lastError || !response || !response.token) {
                console.error('[ClearCuts Picker] Failed to get auth token:', chrome.runtime.lastError ? chrome.runtime.lastError.message : 'no token in response');
                showError('Could not load your Google token. Close this tab and try reconnecting.');
                return;
            }
            if (!response.apiKey) {
                showError('Picker API key not configured. Rebuild extension with PICKER_API_KEY in .env.');
                return;
            }
            token = response.token;
            apiKey = response.apiKey;
            buildPicker();
        });
    }

    function onPickerApiLoad() {
        pickerApiLoaded = true;
        buildPicker();
    }

    requestPickerAuth();

    var gapiLoadTimeout = setTimeout(function() {
        if (!pickerApiLoaded) {
            showError('Google Picker failed to load. Check your internet connection and try again.');
        }
    }, 15000);

    var script = document.createElement('script');
    script.src = 'https://apis.google.com/js/api.js';
    script.onload = function() {
        clearTimeout(gapiLoadTimeout);
        gapi.load('picker', { callback: onPickerApiLoad });
    };
    script.onerror = function() {
        clearTimeout(gapiLoadTimeout);
        showError('Failed to load Google Picker. Check your internet connection and try again.');
    };
    document.head.appendChild(script);
})();
</script>
</body>
</html>
